<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FittList — v3 simplified</title>
<style>
:root{--ink:#141310;--sienna:#C4532B;--cream:#FAF7F0;--card:#FFFFFF;--muted:#7C776C;
 --line:#E8E3D6;--soft:#F1EDE2;
 --coaching:#C4532B; --coaching-bg:#F7E3DA;
 --saved:#3E6B8A;   --saved-bg:#DFE9F0;
 --yours:#4E6B4A;   --yours-bg:#E1EADE;
 --personal:#6B6470;--personal-bg:#E7E3EA;
 --following:#8A7A3C;--following-bg:#EFE8D6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:20px 12px 60px;background:#E7E2D4;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
 display:flex;flex-direction:column;align-items:center;min-height:100vh}
.dev{width:100%;max-width:420px;margin-bottom:14px}
.dev h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7C776C;margin:0 0 10px;font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;
 padding:9px 5px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;line-height:1.25}
.seg button small{display:block;font-weight:500;font-size:10px;color:#7C776C;margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.seg button[aria-pressed="true"] small{color:#C9C3B2}
.hint{font-size:11.5px;color:#7C776C;font-weight:600;line-height:1.55;margin:0}

.phone{width:100%;max-width:420px;background:var(--cream);border-radius:34px;overflow:hidden;position:relative;
 box-shadow:0 24px 60px rgba(20,19,16,.18);display:flex;flex-direction:column;height:min(850px,88vh)}
.scroll{flex:1;overflow-y:auto;position:relative}

.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.mark{width:19px;height:19px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:2px}
.mark i{background:var(--ink);border-radius:1px}
.mark i:nth-child(2),.mark i:nth-child(5){background:transparent}
.beta{background:var(--sienna);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:99px}
.rnd{width:38px;height:38px;border-radius:50%;background:var(--soft);border:none;display:grid;place-items:center;
 font-size:15px;cursor:pointer;color:var(--ink);flex:none;position:relative}
.rnd .pip{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--sienna);border:1.5px solid var(--cream)}

.titlerow{display:flex;align-items:center;gap:9px;padding:16px 18px 14px}
.titlerow h1{margin:0;font-size:33px;font-weight:800;letter-spacing:-.035em;flex:1;line-height:1}
.iconpill{width:46px;height:46px;border-radius:50%;background:var(--card);border:none;display:grid;place-items:center;
 font-size:17px;cursor:pointer;color:var(--ink);flex:none;box-shadow:0 2px 8px rgba(20,19,16,.07);position:relative}
.iconpill[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.iconpill .n{position:absolute;top:-3px;right:-3px;background:var(--sienna);color:#fff;border-radius:99px;
 min-width:19px;height:19px;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--cream);padding:0 4px}

.preset{display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid var(--line);background:var(--card);
 border-radius:16px;padding:15px;font:inherit;cursor:pointer;text-align:left;margin-bottom:8px}
.preset.on{border-color:var(--ink);background:#FFFDF7}
.preset .dot{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center}
.preset.on .dot{border-color:var(--sienna)}
.preset.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sienna)}
.preset .t b{display:block;font-size:15.5px;font-weight:800}
.preset .t small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.45}
.quietnudge{margin:0 18px;background:var(--soft);border-radius:18px;padding:18px;font-size:14px;
 line-height:1.55;color:var(--muted);font-weight:600}
.quietnudge b{display:block;color:var(--ink);font-weight:800;font-size:15px;margin-bottom:4px}
.quietnudge button{margin-top:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
 border-radius:99px;padding:10px 18px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer}
/* share composer, matching the built version */
.shsheet{padding:20px 18px 24px}
.shtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.shtop h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.035em}
.shlabel{font-size:15px;font-weight:800;margin-bottom:9px}
.shlabel span{font-weight:600;color:var(--muted)}
.shcard{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:transparent;
 border-radius:14px;padding:15px 16px;font:inherit;cursor:pointer;text-align:left;margin-bottom:22px}
.shcard .t{flex:1}
.shcard .t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.015em}
.shcard .t small{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:3px}
.shcard .ed{font-size:14.5px;font-weight:800;color:var(--sienna);flex:none}
.shselect{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:transparent;
 border-radius:14px;padding:15px 16px;font:inherit;cursor:pointer;text-align:left;margin-bottom:22px}
.shselect .t{flex:1;font-size:17px;font-weight:700}
.shselect .car{color:var(--muted);font-size:12px}
.sw3{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);flex:none}
.shrow{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.shrow .t{flex:1;font-size:16px;font-weight:800}
.previewwrap{display:flex;justify-content:center}
.poster{width:210px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(20,19,16,.16)}
.ptop{height:7px}
.pbody{padding:14px 13px 16px;position:relative}
.pface{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:2px solid;
 display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.peyebrow{font-size:6.5px;font-weight:800;letter-spacing:.16em;opacity:.65;margin-bottom:7px}
.phead{font-size:19px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-bottom:5px}
.ploc{font-size:8px;font-weight:600;opacity:.6;margin-bottom:13px}
.prow3{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-top:1px solid rgba(128,120,100,.22)}
.pday{width:34px;flex:none;font-size:6.5px;font-weight:800;letter-spacing:.1em;opacity:.6}
.pday b{display:block;font-size:10px;letter-spacing:-.01em;opacity:1;margin-top:1px}
.pcls b{display:block;font-size:9.5px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.pcls small{display:block;font-size:7.5px;font-weight:600;opacity:.55;margin-top:1px}
.pempty{font-size:9px;opacity:.5;font-weight:600;padding:8px 0}
.shbtn{width:100%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;
 padding:16px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.shbtn.dark{background:var(--ink);color:var(--cream)}
.clsrow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px;border:none;border-bottom:1px solid var(--line);
 background:none;font:inherit;cursor:pointer;text-align:left}
.clsrow .t{flex:1}
.clsrow .t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.clsrow .t small{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.tick2{width:26px;height:26px;border-radius:7px;border:1.8px solid var(--line);flex:none;display:grid;place-items:center;
 font-size:14px;color:transparent;font-weight:800}
.tick2.on{background:var(--sienna);border-color:var(--sienna);color:#fff}
.addclass{width:100%;margin-top:14px;border:1.5px dashed var(--line);background:transparent;color:var(--ink);
 border-radius:14px;padding:16px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.helper{font-size:13px;line-height:1.5;color:var(--muted);font-weight:600;margin-top:12px}
.openrow{display:flex;align-items:center;gap:11px;margin:0 14px 10px;width:calc(100% - 28px);
 background:transparent;border:1.5px dashed var(--line);border-radius:20px;padding:14px 16px;
 font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.openrow .dot{width:9px;height:9px;border-radius:50%;background:var(--client);flex:none}
.openrow .t{flex:1}
.openrow .t b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.015em}
.openrow .t small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.openrow .car{color:var(--muted);flex:none}
.addmenu{position:absolute;right:16px;bottom:158px;background:var(--card);border-radius:20px;z-index:15;overflow:hidden;
 box-shadow:0 16px 44px rgba(20,19,16,.26);min-width:268px;opacity:0;transform:scale(.96) translateY(8px);
 transform-origin:bottom right;pointer-events:none;transition:.16s}
.addmenu.open{opacity:1;transform:none;pointer-events:auto}
.addmenu button{display:flex;align-items:center;gap:13px;width:100%;padding:16px 17px;border:none;background:none;
 font:inherit;cursor:pointer;color:var(--ink);text-align:left;border-bottom:1px solid var(--line)}
.addmenu button:last-child{border-bottom:none}
.addmenu .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;color:#fff}
.addmenu .t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.015em}
.addmenu .t small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.linkbox{margin:0 18px;background:var(--card);border-radius:20px;padding:16px}
.linkurl{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:13px;padding:13px 14px;margin-bottom:12px}
.linkurl .u{flex:1;font-size:14.5px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkacts{display:flex;gap:8px}
.linkacts button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:12px;
 font:inherit;font-size:14px;font-weight:800;cursor:pointer;color:var(--ink)}
.linkacts button.dark{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.reqrow{display:flex;gap:12px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line)}
.reqrow .t{flex:1}
.reqrow .t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.015em}
.reqrow .t .w{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.reqrow .t .note{display:block;font-size:13.5px;color:#4A4531;font-weight:600;margin-top:8px;line-height:1.45;
 background:var(--soft);border-radius:11px;padding:10px 12px}
.newbadge{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--client-bg);
 color:var(--client);border-radius:99px;padding:3px 8px;margin-left:7px;vertical-align:middle}
.reqacts{display:flex;gap:8px;margin-top:11px}
.reqacts button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:11px;padding:10px;
 font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.reqacts button.ok{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.clientrow{display:flex;gap:12px;align-items:center;padding:14px 18px;width:100%;background:none;border:none;
 font:inherit;cursor:pointer;text-align:left}
.clientrow .n{flex:1;font-size:16px;font-weight:800;letter-spacing:-.015em}
.clientrow .n small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.availday{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.availday .dn{width:52px;flex:none;font-size:14px;font-weight:800}
.availday .ts{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.tpill{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;
 font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.tpill.on{background:var(--client);border-color:var(--client);color:#fff}
.profhead{padding:14px 20px 24px;text-align:center;border-bottom:1px solid var(--line)}
.profhead .ava{margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.profhead h1{margin:0 0 5px;font-size:27px;font-weight:800;letter-spacing:-.035em}
.profhead p{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.profnote{font-size:13px;color:var(--muted);font-weight:600;margin-top:12px}
.sech2{padding:20px 18px 4px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.profday{padding:16px 18px 8px;font-size:15px;font-weight:800;letter-spacing:-.02em}
.circlewrap{padding:14px 0 4px;border-bottom:1px solid var(--line);transition:opacity .2s}
.circlewrap.dim{opacity:.42}
.dimnote{padding:2px 18px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.circles{display:flex;gap:15px;padding:2px 18px 14px;overflow-x:auto;scrollbar-width:none}
.circles::-webkit-scrollbar{display:none}
.circ{flex:none;width:64px;background:none;border:none;padding:0;font:inherit;cursor:pointer;text-align:center}
.ring{display:block;width:60px;height:60px;border-radius:50%;padding:2.5px;margin:0 auto 7px;background:var(--line)}
.circ.fresh .ring{background:linear-gradient(135deg,var(--sienna),#E08A5F)}
.disc2{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;color:#fff;font-weight:800;
 font-size:17px;border:2.5px solid var(--cream)}
.disc2.plus{background:transparent;color:var(--muted);border:1.5px dashed var(--line);font-size:24px;font-weight:400}
.circ.add .ring{background:transparent;padding:0}
.circ .cn{font-size:12.5px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peekhd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.peekhd .ava{width:48px;height:48px;font-size:15px}
.peekhd .t{flex:1}
.peekhd .t b{display:block;font-size:19px;font-weight:800;letter-spacing:-.025em}
.peekhd .t small{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.peekrow{display:flex;gap:12px;align-items:center;width:100%;padding:14px 2px;border:none;
 border-bottom:1px solid var(--line);background:none;font:inherit;cursor:pointer;text-align:left}
.peekrow .dy{width:52px;flex:none;font-size:13px;font-weight:800;color:var(--muted)}
.peekrow .t{flex:1}
.peekrow .t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.peekrow .t small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.schedstick{position:sticky;top:0;z-index:7;background:var(--cream);border-bottom:1px solid transparent;transition:border-color .2s}
.ctrlrow{position:relative}
.ctrlpin{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:7px;padding:0 14px 0 26px;
 background:linear-gradient(to right,rgba(250,247,240,0) 0%,var(--cream) 22%,var(--cream) 100%)}
.iconpill.sm{width:38px;height:38px;font-size:15px;box-shadow:none;border:1.5px solid var(--line);background:transparent}
.iconpill.sm[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.wordpill.sm{height:38px;padding:0 15px;font-size:14.5px;box-shadow:none;border:1.5px solid var(--line);background:transparent}
.wordpill.sm.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.listbar{display:flex;align-items:center;gap:8px;padding:14px 18px 12px;position:sticky;top:0;z-index:7;
 background:var(--cream);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.listbar.stuck{border-bottom-color:var(--line);box-shadow:0 6px 14px rgba(20,19,16,.05)}
.todaybtn{border:1.5px solid var(--sienna);background:transparent;color:var(--sienna);border-radius:99px;
 height:38px;padding:0 15px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;display:none}
.todaybtn.show{display:block}
.listbar .lb{flex:1;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:-.01em}
.monthlab{font-size:28px;font-weight:800;letter-spacing:-.034em;padding:16px 18px 10px}
.schedstick.stuck{border-bottom-color:var(--line);box-shadow:0 6px 14px rgba(20,19,16,.05)}
.wordpill{height:46px;border-radius:99px;background:var(--card);border:none;padding:0 20px;
 font:inherit;font-size:16px;font-weight:800;cursor:pointer;color:var(--ink);flex:none;
 box-shadow:0 2px 8px rgba(20,19,16,.07);display:flex;align-items:center;gap:8px}
.wordpill.on{background:var(--ink);color:var(--cream)}
.wordpill .fn{background:var(--sienna);color:#fff;border-radius:99px;min-width:21px;height:21px;
 font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.daypills{display:flex;gap:8px;padding:12px 132px 14px 18px;overflow-x:auto;scrollbar-width:none}
.daypills::-webkit-scrollbar{display:none}
.dp{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:11px 18px;
 font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap}
.dp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);font-weight:800}
.dp i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:6px;vertical-align:middle}
.dp .tdot{background:var(--sienna)}
.dp[aria-pressed="true"] .tdot{background:var(--cream)}
.dayhead .d .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sienna);
 margin-right:9px;flex:none}
.activefilters{display:flex;gap:7px;padding:12px 18px 12px;overflow-x:auto;scrollbar-width:none}
.activefilters::-webkit-scrollbar{display:none}
.afc{flex:none;display:flex;align-items:center;gap:7px;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:800;
 border:1.5px solid transparent;cursor:pointer;font-family:inherit}
.afc .x{opacity:.5;font-size:12px}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 10px}
.dayhead .d{font-size:19px;font-weight:800;letter-spacing:-.025em;display:flex;align-items:center;gap:0}
.dayhead .c{font-size:14px;font-weight:600;color:var(--muted)}

/* card — compact, single action in the corner */
.card{display:flex;gap:14px;align-items:flex-start;margin:0 14px 10px;background:var(--card);border-radius:20px;
 padding:16px;width:calc(100% - 28px);text-align:left;border:none;font:inherit;cursor:pointer;position:relative}
.card.accent{box-shadow:inset 3px 0 0 var(--ac)}
.card.flash{animation:flashin 3s ease forwards}
@keyframes flashin{0%{background:#FBEFB8}70%{background:#FBEFB8}100%{background:var(--card)}}
.ava{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.ava.sq{border-radius:17px}
.cbody{flex:1;min-width:0;padding-right:44px}
.cname{font-size:15px;font-weight:600;color:var(--muted);display:block;line-height:1.3;margin-bottom:1px}
.ctitle{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.1;display:block;margin-bottom:5px}
.cmeta{font-size:15px;font-weight:600;color:var(--muted);display:block;line-height:1.35}
.bmk{position:absolute;top:16px;right:14px;border:none;background:none;cursor:pointer;padding:6px;
 display:grid;place-items:center;width:38px;height:38px;border-radius:50%}
.bmk svg{width:23px;height:23px}
.bmk path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.bmk.on path{fill:var(--saved);stroke:var(--saved)}
.ctag{position:absolute;top:18px;right:16px;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}

/* month */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);padding:2px 10px 10px;border-bottom:1px solid var(--line)}
.mhead span{text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}

  clearTimeout(window._t);
  window._t=setTimeout(()=>el('toast').classList.remove('show'),action?5200:2800)}

    return inWeek(c)||mineAdded(c);
  }).filter(c=>!filters.size||filters.has(kindOf(c)))

function emptySchedule(){
  const pf=PREFS[me], isCoach=P[me].r==='Coach', f=[...FOLLOWS[me]];
  const addCard=`<button class="escard" data-addnew="1">
      <span class="ic">+</span>
      <span class="t"><b>Add a class</b><small>${isCoach
        ? 'Your class, your studio, your time. Repeat it weekly in one tap.'
        : "Something you already go to, even if it isn't listed yet"}</small></span>
      <span class="car">&#8250;</span></button>`;

  /* followed someone but pulled nothing yet: teach the pull */
  if(!isCoach && f.length) return `<div class="emptysched">
      <div class="pointup">&#8593;</div>
      <h2>Pull classes from your coaches</h2>
      <p>Following ${f.length===1?P[f[0]].n.split(' ')[0]:`${f.length} coaches`} doesn't fill your week.
        Tap a face above to see what they have on, then save the ones you're going to.</p>
      <div class="escards">
        <button class="escard" data-peekpick="1">
          <span class="stackic">${f.slice(0,3).map(k=>`<span style="background:${C[k]}">${ini(P[k].n)}</span>`).join('')}</span>
          <span class="t"><b>See a coach's week</b><small>${f.map(k=>P[k].n.split(' ')[0].split(',')[0]).join(', ')}</small></span>
          <span class="car">&#8250;</span></button>
        ${addCard}
      </div>
    </div>`;

  return `<div class="emptysched">
    <div class="esart"><span class="esc c1"></span><span class="esc c2"></span><span class="esc c3"></span></div>
    <h2>${isCoach?'No classes yet':'Your week is empty'}</h2>
    <p>${isCoach
      ? "Add the classes you coach. They fill your schedule, your profile and the week you share."
      : "Two ways to fill it. Add a class you go to, or follow a coach and pull classes from their week."}</p>
    <div class="escards">
      ${addCard}
      ${(!isCoach&&pf.discover)?`<button class="escard" data-tab="discover">
        <span class="ic" style="background:var(--saved)">&#9673;</span>
        <span class="t"><b>Follow a coach</b><small>Then pull classes from their week onto yours</small></span>
        <span class="car">&#8250;</span></button>`:''}
    </div>
    ${(isCoach&&!pf.discover)?`<div class="note" style="margin:20px 18px 0">Your studio adds your shifts here. Anything else you coach, add it yourself.</div>`:''}
  </div>`;
}
function listView(){
  const rows=feed();
  if(!rows.length&&!filters.size) return emptySchedule();
  if(!rows.length) return `<div class="emptybox"><p>Nothing matches those filters.</p>
    <button data-clearf="1">Clear filters</button></div>`;
  let out='';
  DAYS.forEach((d,i)=>{
    const day_=rows.filter(c=>c.d===i).sort((a,b)=>a.h-b.h);
    if(!day_.length) return;
    out+=`<div class="dayhead" data-dayanchor="${i}">
      <span class="d">${i===TODAY?'<i class="tdot"></i>Today · ':''}${d.dow}, Aug ${d.n}</span>
      <span class="c">${day_.length}</span></div>`;
    out+=day_.map(c=>card(c)).join('');
  });
  return out+`<div style="height:130px"></div>`;
}
function card(c,done){
  const k=kindOf(c), K=KIND[k], t=teaching(c), s=isSaved(c);
  const dn=done?' done':'';
  const name=c.coach?P[c.coach].n:c.personal?'Personal session':mineAdded(c)?'You added this':`${P[c.creator].n} added this`;
  return `<button class="card ${k!=='following'?'accent':''}${dn} ${flash.has(c.id)?'flash':''}" style="--ac:${K.c}" data-open="${c.id}">
    ${c.coach?av(c.coach,'ava'):av(c.v,'ava sq')}
    <span class="cbody">
      <span class="cname">${name}${SERIES[me].has(c.id)?` · every ${DAYS[c.d].dow}`:''}</span>
      <span class="ctitle">${c.t}</span>
      <span class="cmeta">${c.time} · ${c.dur} · ${V[c.v].n}</span></span>
    ${t?`<span class="ctag" style="background:${K.bg};color:${K.c}">Teaching</span>`
      :c.personal?`<span class="ctag" style="background:${K.bg};color:${K.c}">Personal</span>`
      :`<span class="bmk ${s?'on':''}" data-save="${c.id}">${bm()}</span>`}
  </button>`;
}

function monthView(){
  const rows=feed();
  const cells=[];
  for(let i=0;i<6;i++) cells.push({n:26+i,other:true});
  for(let n=1;n<=31;n++) cells.push({n,other:false});
  while(cells.length%7) cells.push({n:'',other:true});
  const dayIdx=n=>DAYS.findIndex(d=>d.n===n);
  return `<div class="mhead">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="mgrid">${cells.map(c=>{
      const di=c.other?-1:dayIdx(c.n);
      const items=di>=0?rows.filter(x=>x.d===di):[];
      const isToday=!c.other&&c.n===5;
      return `<button class="mcell ${c.other?'other':''} ${isToday?'today':''}" ${di>=0?`data-monthday="${di}"`:''}>
        <span class="num">${c.n}</span>
        ${items.slice(0,2).map(x=>{const K=KIND[kindOf(x)];
          return `<span class="mchip" style="background:${K.bg};color:${K.c}">${titleOf(x).split(',')[0]}</span>`}).join('')}
        ${items.length>2?`<span class="mmore">+${items.length-2}</span>`:''}</button>`}).join('')}</div>
    <div style="padding:18px 18px 130px">
      <div style="font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Key</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${Object.entries(KIND).filter(([k])=>kindsPresent().includes(k)).map(([k,K])=>
        `<button class="afc" data-togglef="${k}" style="background:${filters.size&&!filters.has(k)?'transparent':K.bg};
          color:${K.c};border-color:${K.c}33;opacity:${filters.size&&!filters.has(k)?.45:1}">${K.n}</button>`).join('')}</div></div>`;
}

function classView(id){
  const c=cls(id), t=teaching(c), s=isSaved(c);
  const long=c.about.length>160;
  const coachLinks=c.links.filter(l=>l.role==='coach'), memberLinks=c.links.filter(l=>l.role!=='coach');
  const linkHTML=l=>`<button class="blink"><span class="n">${l.n}
    <span class="s">${l.s}<span class="src ${l.role}">${l.role==='coach'?'From the coach':'Added by a member'}</span></span></span>
    <span style="color:var(--muted)">↗</span></button>`;
  return `<div class="stickyhead" id="sticky">
      <button class="hbtn" data-back="1">←</button><span class="sp">${c.t}</span>
      <button class="hbtn" data-shareclass="1">↑</button><button class="hbtn" data-menu="1">⋯</button></div>
    <div class="hero" style="background:${c.coach?C[c.coach]:C[c.v]}">${c.coach?'class photo':'no photo yet'}</div>
    <div class="dtl">
      <div class="eyebrow">${c.cat}</div><h1 class="dtitle">${c.t}</h1>
      ${c.about?`<p class="blurb">${long&&!expand?c.about.slice(0,150).trim()+'… ':c.about+' '}
        ${long?`<button data-expand="1">${expand?'Less':'More'}</button>`:''}</p>`:''}
      ${c.coach
        ? `<button class="credit" data-coach="${c.coach}">${av(c.coach,'ava')}
            <span class="txt">Coached by <b>${P[c.coach].n}</b><small>${t?"That's you":P[c.coach].bio}</small></span>
            <span style="color:var(--muted)">›</span></button>`
        : c.personal
        ? `<div class="credit" style="cursor:default">${av(c.v,'ava sq')}<span class="txt">A <b>personal session</b>
            <small>Only on your calendar. Nobody else can see it.</small></span></div>`
        : `<div class="credit" style="cursor:default">${av(c.v,'ava sq')}<span class="txt">Added by <b>${c.creator===me?'you':P[c.creator].n}</b>
            <small>Not in the catalog. Details come from whoever added it.</small></span></div>`}
      <div class="fact"><span class="ic">▤</span><span><span class="l1">${DAYS[c.d].dow}, August ${DAYS[c.d].n}</span><span class="l2">${c.time} · ${c.dur}</span></span></div>
      <div class="fact"><span class="ic">◎</span><span><span class="l1">${V[c.v].n}</span><span class="l2">${V[c.v].a}</span></span></div>
      ${c.personal?`<div class="sect"><button class="bigcta ghost" data-back="1">Back to your schedule</button></div>`:`
      <div class="sect">
        ${t?`${(PREFS[me].reach&&(STATS[c.id]?.all||0)>0)?`<div class="statline">
              <span class="big">${STATS[c.id].all}</span><span class="lab">people have saved this class</span>
              <span class="only">Only you see this</span></div>`:''}
            <div class="note">You're coaching this, so it's already on your week.</div>`
          :`<button class="bigcta ${s?'on':''}" data-save="${c.id}">${bm()}${s?'In your week':'Save to my week'}</button>
            <button class="bigcta ghost" style="margin-top:8px" data-series="${c.id}">
              ${SERIES[me].has(c.id)?`Every ${DAYS[c.d].dow} · tap to stop`:`Save every ${DAYS[c.d].dow}`}</button>`}
      </div>
      <div class="sect"><h3>Booking</h3>
        ${coachLinks.map(linkHTML).join('')}
        ${coachLinks.length&&memberLinks.length?`<div style="font-size:11px;font-weight:800;letter-spacing:.12em;
          text-transform:uppercase;color:var(--muted);margin:16px 0 10px">Also suggested</div>`:''}
        ${memberLinks.map(linkHTML).join('')}
        <button class="addlink" data-addlink="${c.id}"><span class="ic">+</span>
          <span><b>Add a booking link</b><small>Anyone can add one. We show who did.</small></span></button>
      </div>`}
    </div>
    ${c.personal?'':`<div class="disclaimer"><p><b>FittList isn't a booking system.</b>
      Class details are posted by coaches and members and may not match the studio's schedule.
      Times change, classes get cancelled. Check with ${V[c.v].n} before you go.
      <span class="lnk" data-report="1">Something wrong?</span></p></div>`}`;
}

function discoverView(){
  const list=Object.keys(P).filter(p=>p!==me&&P[p].r==='Coach'&&(dcat==='All'||P[p].cats.includes(dcat)));
  if(!list.length) return `<div class="emptybox"><p>No coaches in ${dcat} yet. Know one? Invite them and their calendar lands here.</p>
    <button>Invite a coach</button></div>`;
  return list.map(p=>{const f=FOLLOWS[me].has(p);
    return `<div class="pcard">${av(p,'ava')}
      <span class="pinfo"><span class="n">${P[p].n}</span><span class="s">${P[p].bio}</span></span>
      <button class="follow ${f?'on':''}" data-follow="${p}">${f?'Following':'Follow'}</button></div>`}).join('')
    +`<div style="height:100px"></div>`;
}

function peekSheet(id){
  const p=P[id], theirs=CL.filter(c=>c.coach===id).sort((a,b)=>a.d-b.d||a.h-b.h);
  el('sheet').innerHTML=`<div class="grab"></div>
    <div class="peekhd"><span class="ava" style="background:${C[id]}">${ini(p.n)}</span>
      <span class="t"><b>${p.n}</b><small>${theirs.length} class${theirs.length===1?'':'es'} this week</small></span>
      <button class="tpill" data-profile="${id}">Profile</button></div>
    <div style="height:8px"></div>
    ${theirs.length?theirs.map(c=>{const s2=isSaved(c);
      return `<button class="peekrow" data-peeksave="${c.id}">
        <span class="dy">${DAYS[c.d].dow} ${DAYS[c.d].n}</span>
        <span class="t"><b>${c.t}</b><small>${c.time} · ${V[c.v].n}</small></span>
        <span class="savebtn ${s2?'on':''}" style="margin:0">${bm()}${s2?'Saved':'Save'}</span></button>`}).join('')
      :`<div style="padding:24px 4px;text-align:center;font-size:14.5px;color:var(--muted);font-weight:600">
        Nothing on their schedule this week.</div>`}`;
  el('sheet').classList.add('open');el('scrim').classList.add('open');
  document.querySelectorAll('[data-peeksave]').forEach(b=>b.onclick=()=>{
    doSave(+b.dataset.peeksave);peekSheet(id)});
  document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{
    profile=id;view=null;closeSheet();render();el('screen').scrollTop=0});
}

      <div class="sub">${V[a.place].n} · ${DAYS[a.day].dow}, August ${DAYS[a.day].n}</div>

      ${P[me].r==='Coach'?`<div class="switchline"><span class="t"><b>I'm coaching this</b>
        <small>Puts it on your public calendar</small></span>
        <button class="sw" data-atog="coaching" aria-pressed="${a.coaching}"></button></div>`:''}
      <div class="switchline"><span class="t"><b>List it publicly</b>

function doSave(id){
  const c=cls(id), was=SAVED[me].has(id);
  was?SAVED[me].delete(id):SAVED[me].add(id);
  if(was){SERIES[me].delete(id);PICK[me].delete(id)} else PICK[me].add(id);
  render();
  if(was){toast('Removed from your week');return}
  toast(`You saved <b>${c.t}</b> to your week`,
    PREFS[me].share?{label:'Share your week',fn:()=>{tab='share';view=null;render();el('screen').scrollTop=0}}:null);
}

        <span class="n">${v.n}<small>${v.a}</small></span>${adder.place===k?'<span class="tick">✓</span>':''}</button>`).join('')}`;
    document.querySelectorAll('[data-setp]').forEach(x=>x.onclick=()=>{adder.place=x.dataset.setp;adder.q='';drawAdder()})});
  document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{
    el('sheet').innerHTML=`<div class="grab"></div><h3>When?</h3>
      ${DAYS.map((d,i)=>`<button class="opt" data-setd="${i}"><span class="n">${d.dow}, August ${d.n}</span>
        ${adder.day===i?'<span class="tick">✓</span>':''}</button>`).join('')}`;
    document.querySelectorAll('[data-setd]').forEach(x=>x.onclick=()=>{adder.day=+x.dataset.setd;adder.q='';drawAdder()})});
  document.querySelectorAll('[data-apick]').forEach(b=>b.onclick=()=>{
    const c=cls(+b.dataset.apick);
    if(!inWeek(c)){SAVED[me].add(c.id);PICK[me].add(c.id);toast(`<b>${c.t}</b> saved`)}
    else{SAVED[me].delete(c.id);PICK[me].delete(c.id);toast('Removed from your week')}
    drawAdder();render()});
  document.querySelectorAll('[data-anew]').forEach(b=>b.onclick=()=>{adder.name=adder.q;adder.step='form';drawAdder()});
  document.querySelectorAll('[data-atime]').forEach(b=>b.onclick=()=>{
    const [h,l]=b.dataset.atime.split('|');adder.h=+h;adder.tlabel=l;drawAdder()});
  document.querySelectorAll('[data-adur]').forEach(b=>b.onclick=()=>{adder.dur=b.dataset.adur;drawAdder()});
  document.querySelectorAll('[data-atog]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.atog;adder[k]=!adder[k];if(k==='coaching'&&adder.coaching)adder.listed=true;drawAdder()});
  document.querySelectorAll('[data-asave]').forEach(b=>b.onclick=()=>{
    const a=adder, id=Date.now();
    CL.push({id,d:a.day,h:a.h,t:a.name.trim(),cat:'Strength',time:a.tlabel,dur:a.dur,v:a.place,
      coach:a.coaching?me:null,creator:me,personal:!a.listed,links:[],about:''});
    if(!a.coaching){SAVED[me].add(id);PICK[me].add(id)}
    closeSheet();day=a.day;view=null;render();
    toast(a.coaching?`<b>${a.name}</b> on your coaching schedule`
      :a.listed?`<b>${a.name}</b> added and saved`:`<b>${a.name}</b> added as a private session`)});

  const sb=el('sharebtn'); if(sb) sb.onclick=()=>{
    if(!PICK[me].size) week().forEach(c=>PICK[me].add(c.id));
    tab='share';view=null;render();el('screen').scrollTop=0};
  const tbn=el('todaybtn'); if(tbn) tbn.onclick=()=>{
    if(mode!=='list'){mode='list';render()}
    const h=document.querySelector('[data-dayanchor="'+TODAY+'"]');
    if(h) h.scrollIntoView({behavior:'smooth',block:'start'})};
  const fb=el('fab'); if(fb) fb.onclick=openAdder;
}

el('screen').addEventListener('scroll',()=>{
  const s=document.getElementById('sticky');
  if(s) s.classList.toggle('stuck', el('screen').scrollTop>150);
  const lb=document.getElementById('listbar');
  if(!lb) return;
  const top=lb.getBoundingClientRect().bottom;
  lb.classList.toggle('stuck', el('screen').scrollTop>4);
  /* label follows where you are in time, the way a calendar should */
  const heads=[...document.querySelectorAll('[data-dayanchor]')];
  const cur=heads.filter(h=>h.getBoundingClientRect().top<=top+8).pop();
  const t=document.getElementById('lbtext'), tb=document.getElementById('todaybtn');
  if(cur&&t){
    const i=+cur.dataset.dayanchor;
    t.textContent = i===TODAY ? 'Today' : `${DAYS[i].dow}, Aug ${DAYS[i].n}`;
    if(tb) tb.classList.toggle('show', i!==TODAY);
  } else if(t){
    t.textContent = mode==='month'?'August':`${feed().length} this week`;
    if(tb) tb.classList.remove('show');
  }
});

el('scrim').onclick=()=>{closeSheet();el('menu').classList.remove('open')};
document.querySelector('.phone').addEventListener('click',e=>{
  if(!e.target.closest('#menu')&&!e.target.closest('[data-menu]')) el('menu').classList.remove('open')},true);
document.querySelectorAll('#personas button, #personas2 button').forEach(b=>b.onclick=()=>{
  me=b.dataset.p;
  document.querySelectorAll('#personas button, #personas2 button')
    .forEach(x=>x.setAttribute('aria-pressed',x===b));
  tab='schedule';view=null;profile=null;day=TODAY;filters.clear();mode='list';flash=new Set();render()});
render();
</script>
</body>
</html>
