<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112024">
  <title>Reconnect to FittList</title>
  <style>
    * { box-sizing:border-box; }
    html { background:#112024; color:#fff; font:-apple-system-body; }
    body { margin:0; min-height:100dvh; padding:calc(32px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom)); display:grid; place-items:center; }
    main { max-width:360px; width:100%; }
    svg { width:64px; height:64px; margin-bottom:24px; fill:#91f34d; }
    h1 { font-size:1.65rem; line-height:1.2; margin:0 0 16px; }
    p { line-height:1.55; margin:0 0 24px; }
    button { width:100%; min-height:48px; padding:14px 20px; border:0; border-radius:24px; background:#91f34d; color:#112024; font:inherit; font-weight:700; touch-action:manipulation; }
    button:active { opacity:.8; }
    button:disabled { opacity:.65; }
    button:focus-visible { outline:3px solid white; outline-offset:4px; }
    #status { margin-top:20px; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="7" width="54" height="14" rx="3"/><rect x="5" y="26" width="36" height="14" rx="3"/><rect x="5" y="45" width="18" height="14" rx="3"/></svg>
    <h1>Let’s reconnect.</h1>
    <p>FittList couldn’t load. Check your connection, then try again. Your saved calendar will be here when you’re back online.</p>
    <button type="button" id="retry">Try again</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const retry = document.getElementById('retry');
    const status = document.getElementById('status');
    retry.addEventListener('click', () => {
      if (retry.disabled) return;
      retry.disabled = true;
      status.textContent = 'Connecting to FittList…';
      setTimeout(() => { retry.disabled = false; status.textContent = 'Still unable to connect. Please try again.'; }, 15000);
      location.replace('https://www.fittlist.co');
    });
    addEventListener('online', () => { retry.disabled = false; status.textContent = 'Your connection is back. Tap Try again.'; });
    addEventListener('offline', () => { retry.disabled = false; status.textContent = 'You’re offline. Connect to Wi-Fi or mobile data.'; });
  </script>
</body>
</html>
